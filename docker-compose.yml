# Local development stack.
#
# MYSQL IS OPTIONAL HERE, and on the owner's machine it is not used at all:
# MySQL 8.0 is installed natively as the MySQL80 service on 3306, which is why
# the engine moved off PostgreSQL in the first place (C39) --- Docker was never
# installed, and it was the only thing blocking the backend.
#
# This file is for a machine that has Docker but no MySQL. If you run it
# alongside a native MySQL, change the published port: both want 3306.
#
# PGBOUNCER IS GONE with PostgreSQL, and nothing replaces it yet. Pooling still
# matters --- database-per-tenant (C1) means connections grow with the number of
# organizations --- but MySQL has no drop-in equivalent, so it is an open
# question rather than a service here (Q27).

name: xpredict-one

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DB:-xpredict_control}
      MYSQL_USER: ${MYSQL_USER:-xpredict}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-xpredict}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-xpredict-root}
    command:
      # Matches config/settings/base.py. Set here too so that anything reaching
      # the server without Django's OPTIONS --- a shell, a restore, Workbench ---
      # gets the same refusals rather than silent coercion.
      - --sql-mode=STRICT_TRANS_TABLES
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Celery services are commented out until Phase 2 gives them real work.
  # They need a backend image, which arrives with the Dockerfile in Phase 2;
  # run the worker on the host with `celery -A config worker -l info` for now.
  #
  # celery-worker:
  #   build: ./backend
  #   command: celery -A config worker -l info
  #   depends_on: [redis, mysql]
  #
  # celery-beat:
  #   build: ./backend
  #   command: celery -A config beat -l info
  #   depends_on: [redis, mysql]

volumes:
  mysqldata:
  redisdata:
