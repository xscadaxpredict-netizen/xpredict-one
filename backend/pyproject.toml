[project]
name = "xpredict-one-backend"
version = "0.1.0"
description = "Xpredict One --- multi-tenant platform backend (DMS, CRM, E-commerce)"
requires-python = ">=3.12"

dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "djangorestframework-simplejwt>=5.5",
    "mysqlclient>=2.2",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "django-environ>=0.12",
    "django-cors-headers>=4.7",
    # The WSGI server. `manage.py runserver` is single-threaded, reloads on
    # file changes and is documented by Django as unfit for production.
    "gunicorn>=26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "import-linter>=2.1",
    "ruff>=0.9",
    "mypy>=1.14",
    "django-stubs[compatible-mypy]",
    "factory-boy>=3.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "DJ", "S", "RUF"]
ignore = [
    "S101",  # assert --- used throughout the test suite
]

[tool.ruff.lint.per-file-ignores]
# The leading ** matters. This read "*/tests/*", which requires a directory
# before "tests" -- so it covered core/<app>/tests/ and silently missed the
# project-level tests/ directory entirely. Nobody noticed, because nothing in
# there had used a credential until the tenant middleware tests did.
"**/tests/*" = ["S105", "S106"]    # hardcoded test credentials are fine
"config/settings/*" = ["F403", "F405"]  # star imports are the settings idiom
# RUF012 wants ClassVar on mutable class attributes. Django and DRF `Meta`
# inner classes are pure declarative config (fields, ordering, indexes), and
# annotating every one adds noise without catching anything. The rule stays
# active everywhere else, where a shared mutable default is a real bug.
"**/models.py" = ["RUF012"]
"**/serializers.py" = ["RUF012"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["core", "products", "shared", "tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false   # tighten per-module as modules stabilise
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings.dev"


# --------------------------------------------------------------------------
# Module boundaries (CLAUDE.md "Working conventions").
#
# These contracts are the machine-checked version of the rules. Run with
# `lint-imports`. They are what stops the modular monolith quietly becoming
# a tangle --- a product importing another product's models is the single
# change that would make later extraction impossible.
# --------------------------------------------------------------------------

[tool.importlinter]
root_packages = ["core", "products", "shared", "config"]

[[tool.importlinter.contracts]]
name = "Products never import from each other"
type = "independence"
modules = ["products.dms", "products.crm"]

[[tool.importlinter.contracts]]
name = "Layered: products -> core -> shared"
type = "layers"
layers = ["products", "core", "shared"]
containers = []

# A module never reaches into another module's models --- it calls that
# module's service functions, so the owner enforces its own numbering,
# validation, audit and events. These contracts are that rule, checked.
# Add one per new DMS module, listing its siblings as sources.

[[tool.importlinter.contracts]]
name = "DMS: nobody imports dms.sales models/selectors directly"
type = "forbidden"
source_modules = ["products.dms.site_services", "products.dms.tech_support"]
forbidden_modules = ["products.dms.sales.models", "products.dms.sales.selectors"]
# ONE MODEL IS EXEMPT, AND IT IS NAMED RATHER THAN THE RULE RELAXED.
#
# `ConfirmedSite` is not Sales' private state. Its own docstring calls it "the
# pivot point of the entire system -- all site-services, AMC quotes,
# complaints, ecommerce orders and timer calculations point to this table", and
# four modules do. This contract was written when DMS was three independent
# modules and no such pivot existed; its premise does not hold for this one row.
#
# WHAT WAS REJECTED, and why it would have been worse: wrapping the queries in
# a `sales.services.get_confirmed_site()` and importing that instead. The
# linter would pass and site-services would still hold Sales model instances
# and serialise their fields -- identical coupling, green gate. A check
# satisfied without changing what it measures is a check that has been broken,
# not passed.
#
# WHAT THIS EXEMPTION DOES NOT DO, measured rather than assumed: it is not
# per-name. `ignore_imports` works on the module-to-module EDGE, so these four
# lines excuse everything `site_services` imports from `sales.models`, not just
# `ConfirmedSite`. Adding `Enquiry` to one of those imports was tried and the
# contract still passed. The three OTHER source modules -- tech_support, and
# anything added later -- are still fully covered.
#
# THE STRUCTURAL FIX is to move `ConfirmedSite` into its own module so the
# forbidden edge genuinely does not exist. It cannot be a re-export, because a
# forbidden contract follows chains: `site_services -> sales.sites ->
# sales.models` is reported exactly like the direct import. A real move means
# its foreign keys to Enquiry, Customer and Quotation become string references
# to break the import cycle -- no migration, since Django tracks models by app
# label rather than by file, but a genuine change to someone's model layer.
#
# That is a decision with risk attached, not a lint fix, so it is written down
# here rather than done quietly.
ignore_imports = [
    "products.dms.site_services.selectors -> products.dms.sales.models",
    "products.dms.site_services.services -> products.dms.sales.models",
    "products.dms.site_services.api.serializers -> products.dms.sales.models",
    "products.dms.site_services.api.serializers -> products.dms.sales.api.serializers",
]

[[tool.importlinter.contracts]]
name = "DMS: nobody imports dms.site_services models/selectors directly"
type = "forbidden"
source_modules = ["products.dms.sales", "products.dms.tech_support"]
forbidden_modules = ["products.dms.site_services.models", "products.dms.site_services.selectors"]

[[tool.importlinter.contracts]]
name = "DMS: nobody imports dms.tech_support models/selectors directly"
type = "forbidden"
source_modules = ["products.dms.sales", "products.dms.site_services"]
forbidden_modules = [
    "products.dms.tech_support.models",
    "products.dms.tech_support.selectors",
]

[[tool.importlinter.contracts]]
name = "shared/ holds no business logic and imports nothing local"
type = "forbidden"
source_modules = ["shared"]
forbidden_modules = ["core", "products", "config"]
