name: Production Deployment

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Connect and Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "🚀 1. Pulling latest commit..."
            cd /srv/xpredict
            git config --global --add safe.directory /srv/xpredict
            git pull origin main

            echo "📦 2. Updating Backend..."
            cd /srv/xpredict/backend
            source .venv/bin/activate
            pip install -r requirements.lock.txt
            python manage.py migrate --database=default --settings=config.settings.prod
            # `migrate` only touches the control database. Every organisation has its
            # own database (C1), migrated only by provision_tenant at signup and by
            # this command. Without it, new tenant migrations never reach customers
            # and every page that reads a changed table answers 500.
            python manage.py migrate_all_tenants --plan --settings=config.settings.prod
            python manage.py migrate_all_tenants --settings=config.settings.prod
            python manage.py collectstatic --no-input --settings=config.settings.prod

            echo "⚛️ 3. Building Frontend..."
            cd /srv/xpredict/frontend
            npm ci
            npm run build -w web

            echo "🔄 4. Reloading Services (Zero-Downtime)..."
            sudo systemctl reload xpredict-gunicorn
            sudo systemctl restart xpredict-celery
            sudo systemctl reload nginx

            echo "✨ Deployment Complete!"
