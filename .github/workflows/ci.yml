name: CI Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install MySQL client libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config default-libmysqlclient-dev

      - name: Install Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: Ruff Check
        working-directory: backend
        run: |
          ruff check .

      - name: Start MySQL and setup test database
        run: |
          sudo systemctl start mysql.service
          mysql -u root -proot < backend/scripts/create_dev_db.sql || sudo mysql < backend/scripts/create_dev_db.sql

      - name: Run Pytest
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          SECRET_KEY: ci-test-key-for-unit-testing-32-chars-long
        run: |
          python -m pytest tests/ -q

  frontend-check:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend
        working-directory: frontend
        run: |
          npm ci

      - name: Typecheck
        working-directory: frontend
        run: |
          npm run typecheck -w web

      - name: Test Production Build
        working-directory: frontend
        run: |
          npm run build -w web
