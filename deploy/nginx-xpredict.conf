# Nginx site for Xpredict One.
#
# ONE ORIGIN SERVES BOTH THE SPA AND THE API, and that is a decision the code
# already relies on: `request()` in `packages/api-client` uses relative URLs,
# and `vite.config.ts` says its dev proxy "has no production equivalent".
# Serving the frontend from a different host would mean CORS, SameSite=None
# cookies and a second origin to keep in step -- none of which anything here
# is written for.
#
# INSTALL:
#   sudo cp deploy/nginx-xpredict.conf /etc/nginx/sites-available/xpredict
#   sudo ln -s /etc/nginx/sites-available/xpredict /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot, which EDITS THIS FILE IN PLACE: it adds the TLS directives
# and the port 80 redirect. Everything below is the pre-certbot state.
# Replace app.example.com with the real hostname before installing.

upstream xpredict_app {
    # Matches `bind` in deploy/gunicorn.conf.py.
    server unix:/run/xpredict/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    # The built SPA: `npm run build -w web` output, copied to this path.
    root /srv/xpredict/frontend;
    index index.html;

    # Uploads and request bodies. Nothing takes a large upload yet; this is
    # small on purpose so that when something does, it is a deliberate change.
    client_max_body_size 4m;

    # Compress what is worth compressing. Not images -- already compressed --
    # and not anything under 1 KB, where the header costs more than it saves.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- The API ------------------------------------------------------------
    #
    # EVERY HEADER BELOW IS LOAD-BEARING. In particular X-Forwarded-Proto:
    # `prod.py` sets SECURE_PROXY_SSL_HEADER, so Django decides whether a
    # request is secure from that header alone. Omit it and Django believes
    # every request is plain HTTP, SECURE_SSL_REDIRECT sends a 301 to the URL
    # it just received, and the browser loops until it gives up.
    location /api/ {
        proxy_pass http://xpredict_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer than gunicorn's own 30s timeout, so a slow request is killed
        # by Gunicorn (which logs it) rather than by Nginx (which does not know
        # what it was).
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        # Responses carry Set-Cookie for the auth cookies; nothing here may be
        # cached by an intermediary.
        proxy_buffering off;
    }

    # --- Django admin -------------------------------------------------------
    #
    # Reachable, and worth thinking about: it is a second way into the control
    # database and it is not part of the product. If it is not wanted in
    # production, delete this block -- `config/urls.py` still routes it, but
    # nothing outside the box can reach it.
    location /admin/ {
        proxy_pass http://xpredict_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django's own static files -- the admin's CSS, and nothing else today.
    # Produced by `manage.py collectstatic` into STATIC_ROOT.
    location /static/ {
        alias /srv/xpredict/backend/staticfiles/;
        access_log off;
        expires 30d;
    }

    # --- Uploaded files -----------------------------------------------------
    #
    # WITHOUT THIS BLOCK UPLOADS LOOK LIKE THEY WORK AND THEN DO NOT, which is
    # why it is worth more comment than it looks like it needs. `config/urls.py`
    # serves MEDIA_URL only `if settings.DEBUG`, and `prod.py` hardcodes
    # DEBUG = False -- so in production Django never serves these at all. With
    # no `/media/` location, `/media/x.png` falls through to `location /` and
    # its `try_files $uri $uri/ /index.html`, and the browser asking for a
    # signature gets the SPA's HTML **with a 200 status**. Broken images
    # everywhere and nothing in any log, because as far as Nginx is concerned
    # it served a page successfully.
    #
    # THESE FILES ARE PUBLIC TO ANYONE WITH THE URL, and that is not a decision
    # made here -- it is what the application already assumes.
    # `FileAttachmentCell.tsx` does a bare `fetch(fileUrl)` with no credentials,
    # and the serializers hand out `FileField.url` directly, so an authenticated
    # endpoint would break every download until the frontend changed with it.
    # It also has to stay reachable without a session for the public
    # service-report sign links (C56's shape, Q45's question).
    #
    # WHAT THAT COSTS, written down rather than discovered later: `upload_to`
    # carries no tenant segment -- "reports/signatures/client/", not
    # "<org>/reports/..." -- so every organisation's files share one tree, and a
    # URL is the only thing standing between a stranger and a customer's signed
    # service report. Django appends a random suffix on filename collision, so
    # the paths are not enumerable by guessing, but they are not secret either:
    # they reach the browser, proxy logs and anybody the link is forwarded to.
    # **Q48 is whether that is acceptable**, and the fix is an authorised
    # endpoint plus X-Accel-Redirect back to an `internal;` version of this
    # block -- which is why the alias below is kept trivially swappable.
    location /media/ {
        alias /srv/xpredict/backend/media/;

        # No `expires` far in the future: unlike /assets/, these filenames are
        # not content-hashed, so a replaced attachment must not be served from
        # a cache for a year. Private, because an intermediary caching one
        # customer's document is the one thing worse than serving it.
        expires 5m;
        add_header Cache-Control "private, max-age=300";

        # THE ONLY FRAMING PROTECTION THESE FILES GET, and the reason it has to
        # be here rather than in Django.
        #
        # `X_FRAME_OPTIONS` in Django is applied by its middleware to DJANGO's
        # responses. In production Nginx serves this directory by `alias`, so
        # Django is not in the request at all and `prod.py`'s "DENY" never
        # reaches it -- measured, not assumed: Nginx sets no X-Frame-Options
        # anywhere, so without this line every uploaded file is framable by any
        # site on the internet.
        #
        # SAMEORIGIN rather than DENY, because the PDF preview modal iframes
        # these URLs directly (`PreviewModal` takes `url={manual.file}`). DENY
        # here would break the preview -- in production only, which is exactly
        # the kind of failure this file exists to prevent.
        #
        # In DEVELOPMENT the same files come from Django (`config/urls.py`
        # serves MEDIA_URL `if settings.DEBUG`) and get SAMEORIGIN from
        # `base.py`. Same value from a different place, which is why the
        # preview behaves identically in both.
        add_header X-Frame-Options "SAMEORIGIN";

        # Not `nosniff`'s friend by accident: these are user-supplied files
        # served from our own origin, so a mislabelled upload must not be
        # sniffed into something executable.
        add_header X-Content-Type-Options "nosniff";

        # A missing file is a 404, not the SPA. Without this it inherits the
        # fallthrough that caused the original bug.
        try_files $uri =404;

        # Never execute anything out of an upload directory. Nothing here is
        # meant to run, and `client_max_body_size` above means somebody can put
        # a 4 MB file of their choosing in it.
        location ~ \.(php|py|pl|cgi|sh)$ {
            deny all;
        }
    }

    # --- The SPA ------------------------------------------------------------
    #
    # Vite emits hashed filenames under /assets/, so those are immutable and
    # can be cached hard.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # EVERYTHING ELSE IS index.html, because the SPA owns its own routing.
    # Without this, a reload on /acme-motors/admin/dealers -- or an invitation
    # link, which is the one people are handed (C56) -- is a 404 from Nginx
    # for a path that only React knows about.
    #
    # index.html itself must NOT be cached, or a deploy leaves browsers asking
    # for asset filenames that no longer exist.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
