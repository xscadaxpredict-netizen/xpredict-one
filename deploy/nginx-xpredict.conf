# Nginx site for Xpredict One.
#
# ONE ORIGIN SERVES BOTH THE SPA AND THE API, and that is a decision the code
# already relies on: `request()` in `packages/api-client` uses relative URLs,
# and `vite.config.ts` says its dev proxy "has no production equivalent".
# Serving the frontend from a different host would mean CORS, SameSite=None
# cookies and a second origin to keep in step -- none of which anything here
# is written for.
#
# INSTALL:
#   sudo cp deploy/nginx-xpredict.conf /etc/nginx/sites-available/xpredict
#   sudo ln -s /etc/nginx/sites-available/xpredict /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot, which EDITS THIS FILE IN PLACE: it adds the TLS directives
# and the port 80 redirect. Everything below is the pre-certbot state.
# Replace app.example.com with the real hostname before installing.

upstream xpredict_app {
    # Matches `bind` in deploy/gunicorn.conf.py.
    server unix:/run/xpredict/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    # The built SPA: `npm run build -w web` output, copied to this path.
    root /srv/xpredict/frontend;
    index index.html;

    # Uploads and request bodies. Nothing takes a large upload yet; this is
    # small on purpose so that when something does, it is a deliberate change.
    client_max_body_size 4m;

    # Compress what is worth compressing. Not images -- already compressed --
    # and not anything under 1 KB, where the header costs more than it saves.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- The API ------------------------------------------------------------
    #
    # EVERY HEADER BELOW IS LOAD-BEARING. In particular X-Forwarded-Proto:
    # `prod.py` sets SECURE_PROXY_SSL_HEADER, so Django decides whether a
    # request is secure from that header alone. Omit it and Django believes
    # every request is plain HTTP, SECURE_SSL_REDIRECT sends a 301 to the URL
    # it just received, and the browser loops until it gives up.
    location /api/ {
        proxy_pass http://xpredict_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer than gunicorn's own 30s timeout, so a slow request is killed
        # by Gunicorn (which logs it) rather than by Nginx (which does not know
        # what it was).
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        # Responses carry Set-Cookie for the auth cookies; nothing here may be
        # cached by an intermediary.
        proxy_buffering off;
    }

    # --- Django admin -------------------------------------------------------
    #
    # Reachable, and worth thinking about: it is a second way into the control
    # database and it is not part of the product. If it is not wanted in
    # production, delete this block -- `config/urls.py` still routes it, but
    # nothing outside the box can reach it.
    location /admin/ {
        proxy_pass http://xpredict_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django's own static files -- the admin's CSS, and nothing else today.
    # Produced by `manage.py collectstatic` into STATIC_ROOT.
    location /static/ {
        alias /srv/xpredict/backend/staticfiles/;
        access_log off;
        expires 30d;
    }

    # --- The SPA ------------------------------------------------------------
    #
    # Vite emits hashed filenames under /assets/, so those are immutable and
    # can be cached hard.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # EVERYTHING ELSE IS index.html, because the SPA owns its own routing.
    # Without this, a reload on /acme-motors/admin/dealers -- or an invitation
    # link, which is the one people are handed (C56) -- is a 404 from Nginx
    # for a path that only React knows about.
    #
    # index.html itself must NOT be cached, or a deploy leaves browsers asking
    # for asset filenames that no longer exist.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
